<svg xmlns="http://www.w3.org/2000/svg" width="960" height="225" viewBox="0 0 960 225" role="img" aria-labelledby="title desc">
<title id="title">Hi, I'm Bing 👋</title>
<desc id="desc">把 AI 放进具体场景，让工具更好用。</desc>
<style>
.text {fill:#f0f6fc}
.title {font:700 56px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-variant-ligatures:none}
.subtitle {font:600 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.cycle {animation: cycle 10s linear infinite}
.reveal {animation: typing 10s linear infinite}
.cursor {animation: travel 10s linear infinite}
.cursor-mark {opacity:0; animation: blink 10s linear infinite}
.hand {transform-origin:457px 64px; animation: wave 10s ease-in-out infinite}
.rule {transform-origin:0px 115px; animation: expand 10s ease-out infinite}
.subtitle {animation: enter 10s ease-out infinite}
@keyframes cycle {0%,92%{opacity:1}98%,100%{opacity:0}}
@keyframes typing {0%{width:0px;animation-timing-function:steps(12,end)}20%,100%{width:404px}}
@keyframes travel {0%{transform:translateX(0px);animation-timing-function:steps(12,end)}20%,100%{transform:translateX(404px)}}
@keyframes blink {0%,4%,8%,12%,16%,20%,24%{opacity:1}2%,6%,10%,14%,18%,22%,26%,100%{opacity:0}}
@keyframes wave {0%,20%,40%,100%{transform:rotate(0deg)}24%,32%{transform:rotate(14deg)}28%,36%{transform:rotate(-10deg)}}
@keyframes expand {0%,22%{transform:scaleX(0)}30%,100%{transform:scaleX(1)}}
@keyframes enter {0%,30%{opacity:0;transform:translateY(6px)}40%,100%{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.cycle,.reveal,.cursor,.cursor-mark,.hand,.rule,.subtitle{animation:none}.cursor-mark{opacity:0}}
</style>
<defs><clipPath id="typed"><rect class="reveal" x="0" y="10" width="404" height="92"/></clipPath></defs>
<g class="cycle">
<text class="text title" x="0" y="79" clip-path="url(#typed)">Hi, I'm Bing</text>
<g class="cursor"><rect class="text cursor-mark" x="2" y="31" width="3" height="53" rx="1"/></g>
<g class="hand"><text x="424" y="80" font-size="60" font-family="Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif">👋</text></g>
<path class="rule" d="M0 115H960" stroke="#3d444d" stroke-width="1.5"/>
<text class="text subtitle" x="0" y="180">把 AI 放进具体场景，让工具更好用。</text>
</g>
</svg>